          - href: 03-refuerzos/clase1-decisiones-secuenciales.ipynb
            text: "Clase 1 — Decisiones secuenciales y Q-learning"
          - href: 03-refuerzos/enunciado-clase1.md
            text: "Práctico — Clase 1"
          - href: 03-refuerzos/clase2-dqn.ipynb
            text: "Clase 2 — Aproximación de funciones y DQN"
          - href: 03-refuerzos/enunciado-clase2.md
            text: "Práctico — Clase 2"
  sidebar:
    style: floating
    contents:
      - href: index.qmd
        text: Inicio
