      - section: "03 · Aprendizaje por refuerzos"
        contents:
          - href: 03-refuerzos/clase1-decisiones-secuenciales.ipynb
            text: "Clase 1"
          - href: 03-refuerzos/enunciado-clase1.md
            text: "Práctico 1"
          - href: 03-refuerzos/clase2-dqn.ipynb
